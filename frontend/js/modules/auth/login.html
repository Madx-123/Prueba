<div class="auth-page" id="main-content">

  <!-- COLUMNA IZQUIERDA: FORMULARIO MINIMALISTA ESTILO CAFFEINE -->
  <main class="auth-left">
    <header class="auth-top-bar">
      <a href="#/" class="auth-logo-link" aria-label="Volver al inicio de ContentAI PYMES">
        content<span>ai</span>
      </a>
    </header>

    <section class="auth-center-box">
      <h1>Bienvenido a ContentAI</h1>
      <p class="auth-subtitle">Usa tu cuenta o crea una nueva</p>

      <!-- Selector tipo píldora sutil -->
      <div class="auth-switch" role="group" aria-label="Opciones de acceso">
        <button type="button" class="selected" aria-current="page">Iniciar sesión</button>
        <button type="button" id="btn-go-register">Crear cuenta</button>
      </div>

      <!-- Formulario de Login (Correo + Contraseña) -->
      <form id="login-form" class="auth-form" novalidate>
        <div class="auth-pill-field">
          <input
            id="auth-email"
            type="email"
            name="correo"
            placeholder="Correo electrónico"
            autocomplete="email"
            aria-label="Correo electrónico"
            required
          >
          <span class="auth-pill-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="3"/>
              <path d="m3 7 9 6 9-6"/>
            </svg>
          </span>
        </div>

        <div class="auth-pill-field">
          <input
            id="auth-password"
            type="password"
            name="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            aria-label="Contraseña"
            required
          >
          <button
            type="button"
            class="auth-password-toggle"
            data-password-toggle="auth-password"
            aria-label="Mostrar contraseña"
            aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.7-7 10-7 10 7 10 7-3.7 7-10 7S2 12 2 12Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <button id="btn-submit" class="auth-submit" type="submit">
          <span class="auth-submit-label">Entrar a mi espacio</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/>
            <path d="m13 6 6 6-6 6"/>
          </svg>
        </button>
      </form>

      <p class="auth-terms">
        ¿Todavía no tienes una cuenta? <a href="#/registro">Regístrate gratis</a>
      </p>
    </section>

    <footer class="auth-bottom-bar">
      <span class="auth-tech-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.74-8z"/>
        </svg>
        CON TECNOLOGÍA DE CONTENTAI
      </span>
      <div class="auth-bottom-links">
        <a href="#/">Inicio</a>
        <a href="#/registro">Crear cuenta</a>
      </div>
    </footer>
  </main>

  <!-- COLUMNA DERECHA: ESCENA DE ÍCONOS FLOTANTES -->
  <aside class="auth-right" aria-hidden="true">
    <div class="auth-orbit-scene">
      <!-- Ícono 1: Desenfocado izquierda abajo (Verde oliva/lima) -->
      <div class="auth-float-card card-blur-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="7"/>
          <path d="M12 9v3l2 2"/>
        </svg>
      </div>

      <!-- Ícono 2: Verde lima (Megáfono / Campaña) -->
      <div class="auth-float-card card-lime">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 3 3 10.53v.98l6.84 2.65L12.48 21h.98L21 3Z"/>
        </svg>
      </div>

      <!-- Ícono 3: Rosa (Burbuja de mensaje / Copy) -->
      <div class="auth-float-card card-pink-chat">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2ZM8 11a1.25 1.25 0 1 1 0-2.5A1.25 1.25 0 0 1 8 11Zm4 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5Zm4 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5Z"/>
        </svg>
      </div>

      <!-- Ícono 4: Malva/Rosa (Carrito / Comercio PYME) -->
      <div class="auth-float-card card-pink-shop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="20" r="1.6" fill="currentColor"/>
          <circle cx="18" cy="20" r="1.6" fill="currentColor"/>
          <path d="M2.5 3h2.8l2.4 11.5a2 2 0 0 0 2 1.5h8.8a2 2 0 0 0 1.9-1.4L22 7H6.2"/>
        </svg>
      </div>

      <!-- Ícono 5: Celeste (Mundo / Redes digitales) -->
      <div class="auth-float-card card-sky">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3.6 9h16.8M3.6 15h16.8M12 3a14.5 14.5 0 0 1 0 18M12 3a14.5 14.5 0 0 0 0 18"/>
        </svg>
      </div>

      <!-- Ícono 6: Desenfocado derecha abajo (Lavanda/Azul) -->
      <div class="auth-float-card card-blur-right">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21s-7.5-4.35-9.5-9.1C1.1 8.4 3.5 4.5 7.4 4.5c2.1 0 3.7 1.1 4.6 2.6.9-1.5 2.5-2.6 4.6-2.6 3.9 0 6.3 3.9 4.9 7.4-2 4.75-9.5 9.1-9.5 9.1Z"/>
        </svg>
      </div>
    </div>

    <div class="auth-right-copy">
      <h2>Tu negocio.<br>Tus herramientas.</h2>
      <p>Creadas en minutos.</p>
    </div>
  </aside>

</div>
